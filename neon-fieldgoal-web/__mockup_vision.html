<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon FieldGoal Vision Mockup</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 28%, rgba(0,245,255,0.12), transparent 38%),
        linear-gradient(180deg, #02040a 0%, #050914 100%);
    }

    body {
      display: grid;
      place-items: center;
    }

    body[data-ready="0"]::before {
      content: "Preparing Neon FieldGoal vision mockup...";
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #00f5ff;
      font: 700 18px/1.2 Arial, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background:
        radial-gradient(circle at 50% 35%, rgba(0,245,255,0.12), transparent 45%),
        linear-gradient(180deg, #02040a 0%, #070d17 100%);
    }

    iframe {
      border: 0;
      width: 1180px;
      height: 664px;
      display: block;
      background: transparent;
    }
  </style>
</head>
<body data-ready="0">
  <iframe id="game" src="/"></iframe>
  <script>
    const frame = document.getElementById("game");

    function primeMockup() {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      if (!win || !doc || !win.__nfgDebug) {
        requestAnimationFrame(primeMockup);
        return;
      }

      const api = win.__nfgDebug;
      api.setSelectedMode("longBomb");
      api.startGame();

      const state = api.state;
      state.score = 145;
      state.goals = 15;
      state.streak = 5;
      state.maxStreak = 6;
      state.multiplier = 3;
      state.longestKick = 60;
      state.yardLine = 50;
      state.timeLeft = 12.8;
      state.visualTimeLeft = 12.8;
      state.windDir = 0;
      state.windForce = 0.04;
      state.movingGoalActive = true;
      state.goalSwayDisplay = 0.12;
      state.heroMoment.energy = 1;
      state.heroMoment.display = 1;
      state.heroMoment.label = "LASER BANGER";
      state.heroMoment.copy = "THREAD THE BLOCK WALL";
      state.heroMoment.color = "#ff006e";
      state.heroMoment.accent = "#ffe600";

      const announce = doc.getElementById("announcement");
      doc.getElementById("announceTxt").textContent = "GOOOOOOAL!";
      doc.getElementById("announceTxt").style.color = "#ffe600";
      doc.getElementById("announceSubtxt").textContent = "LEVEL 10 HEAT • STADIUM LIVE";
      announce.classList.add("show");

      const hero = doc.getElementById("heroBanner");
      const heroLabel = doc.getElementById("heroBannerLabel");
      const heroCopy = doc.getElementById("heroBannerCopy");
      heroLabel.textContent = "LASER BANGER";
      heroLabel.style.color = "#ff006e";
      heroCopy.textContent = "THREAD THE BLOCK WALL";
      heroCopy.style.color = "rgba(255,230,0,0.9)";
      hero.classList.add("show");
      hero.style.opacity = "1";
      hero.style.transform = "translateX(-50%) scale(1)";
      hero.style.borderColor = "rgba(255,0,110,0.35)";
      hero.style.boxShadow = "0 0 28px rgba(255,0,110,0.18), inset 0 0 22px rgba(255,230,0,0.08)";

      document.body.dataset.ready = "1";
    }

    frame.addEventListener("load", () => {
      setTimeout(primeMockup, 350);
    });
  </script>
</body>
</html>
