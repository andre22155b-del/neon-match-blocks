<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Addem Widget Mock</title>
<style>
  :root {
    --bg1: #f3eaff;
    --bg2: #e8dcfb;
    --ink: #3f2f63;
    --sub: #7c67a8;
    --line: rgba(255,255,255,.75);
    --card: rgba(255,255,255,.42);
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 15% 10%, #ffffff, transparent 30%), linear-gradient(140deg,var(--bg1),var(--bg2));
    font-family: "SF Pro Display", "Avenir Next", system-ui, sans-serif;
  }
  .widget {
    width: 760px;
    border-radius: 34px;
    background: var(--card);
    border: 1px solid var(--line);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 24px;
    box-shadow: 0 12px 40px rgba(86,58,128,.18), inset 0 1px 0 rgba(255,255,255,.8);
  }
  .head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 16px;
  }
  .title {
    font-size: 34px;
    font-weight: 800;
    color: #6b4bb1;
    letter-spacing: .2px;
  }
  .sub {
    font-size: 17px;
    color: var(--sub);
  }
  .row {
    display: grid;
    grid-template-columns: 12px 1fr auto;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
    border-radius: 14px;
    padding: 10px 12px;
    background: rgba(255,255,255,.45);
    border: 1px solid rgba(255,255,255,.6);
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 99px;
    background: #fff;
    box-shadow: 0 0 0 1px #decffa;
  }
  .domain { color: var(--ink); font-weight: 650; font-size: 19px; }
  .note { color: var(--sub); font-size: 15px; }
  .chip {
    margin-top: 6px;
    margin-left: auto;
    width: fit-content;
    padding: 7px 14px;
    border-radius: 11px;
    color: #fff;
    background: linear-gradient(180deg,#b08ef0,#9b78df);
    font-size: 14px;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="widget">
    <div class="head">
      <div class="title">Addem</div>
      <div class="sub">Pinned Links</div>
    </div>
    <div class="row"><div class="dot"></div><div class="domain">developer.apple.com</div><div class="note">SwiftUI docs</div></div>
    <div class="row"><div class="dot"></div><div class="domain">github.com</div><div class="note">My repos</div></div>
    <div class="row"><div class="dot"></div><div class="domain">notion.so</div><div class="note">Project notes</div></div>
    <div class="row"><div class="dot"></div><div class="domain">stackoverflow.com</div><div class="note">Quick fixes</div></div>
    <div class="chip">Open</div>
  </div>
</body>
</html>
