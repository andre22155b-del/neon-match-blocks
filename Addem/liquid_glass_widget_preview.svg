<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f4ff"/>
      <stop offset="100%" stop-color="#e9ddfb"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8c2ff" stop-opacity="0.40"/>
      <stop offset="55%" stop-color="#b194f4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e4daff" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7f5bd6"/>
      <stop offset="100%" stop-color="#c6b4f8"/>
    </linearGradient>
    <filter id="blur20" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#7456b7" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="url(#bg)"/>

  <g filter="url(#drop)">
    <rect x="120" y="120" width="960" height="520" rx="36" fill="rgba(255,255,255,0.20)" stroke="rgba(255,255,255,0.70)" stroke-width="2"/>
    <rect x="120" y="120" width="960" height="520" rx="36" fill="url(#glass)"/>
  </g>

  <circle cx="210" cy="165" r="120" fill="rgba(255,255,255,0.45)" filter="url(#blur20)"/>
  <circle cx="980" cy="560" r="160" fill="rgba(155,113,245,0.35)" filter="url(#blur20)"/>

  <rect x="138" y="136" width="924" height="100" rx="30" fill="rgba(255,255,255,0.24)"/>
  <text x="160" y="198" font-family="SF Pro Display, Avenir Next, system-ui" font-size="56" font-weight="800" fill="url(#titleGrad)">AddEm</text>
  <rect x="905" y="162" width="140" height="52" rx="26" fill="rgba(255,255,255,0.45)" stroke="rgba(255,255,255,0.65)"/>
  <text x="975" y="196" text-anchor="middle" font-family="SF Pro Display, system-ui" font-size="24" font-weight="600" fill="#463a62">4 links</text>

  <g font-family="SF Pro Display, system-ui" fill="#2a253b">
    <g>
      <rect x="160" y="260" width="880" height="78" rx="20" fill="rgba(255,255,255,0.42)" stroke="rgba(255,255,255,0.62)"/>
      <circle cx="190" cy="298" r="7" fill="rgba(255,255,255,0.95)"/>
      <text x="212" y="300" font-size="28" font-weight="640">Apple Dev</text>
      <text x="212" y="324" font-size="18" fill="rgba(42,37,59,0.68)">developer.apple.com</text>
    </g>
    <g>
      <rect x="160" y="356" width="880" height="78" rx="20" fill="rgba(255,255,255,0.42)" stroke="rgba(255,255,255,0.62)"/>
      <circle cx="190" cy="394" r="7" fill="rgba(255,255,255,0.95)"/>
      <text x="212" y="396" font-size="28" font-weight="640">HN</text>
      <text x="212" y="420" font-size="18" fill="rgba(42,37,59,0.68)">news.ycombinator.com</text>
    </g>
    <g>
      <rect x="160" y="452" width="880" height="78" rx="20" fill="rgba(255,255,255,0.42)" stroke="rgba(255,255,255,0.62)"/>
      <circle cx="190" cy="490" r="7" fill="rgba(255,255,255,0.95)"/>
      <text x="212" y="492" font-size="28" font-weight="640">Notion Docs</text>
      <text x="212" y="516" font-size="18" fill="rgba(42,37,59,0.68)">notion.so</text>
    </g>
    <g>
      <rect x="160" y="548" width="880" height="78" rx="20" fill="rgba(255,255,255,0.42)" stroke="rgba(255,255,255,0.62)"/>
      <circle cx="190" cy="586" r="7" fill="rgba(255,255,255,0.95)"/>
      <text x="212" y="588" font-size="28" font-weight="640">Design Inspiration</text>
      <text x="212" y="612" font-size="18" fill="rgba(42,37,59,0.68)">dribbble.com</text>
    </g>
  </g>
</svg>
