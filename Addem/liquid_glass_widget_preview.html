<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root {
    --accent: #7f5bd6;
    --accent-soft: #c6b4f8;
    --text: #2a253b;
  }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: "SF Pro Display", "Avenir Next", system-ui, sans-serif;
    background: radial-gradient(circle at 20% 20%, #ffffff 0%, #f0e9ff 35%, #e8dcfb 100%);
    display: grid;
    place-items: center;
  }
  .widget {
    width: 760px;
    border-radius: 28px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(140deg, rgba(214,194,255,.40), rgba(176,149,244,.22), rgba(228,218,255,.18));
    border: 1px solid rgba(255,255,255,.65);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.70), 0 20px 40px rgba(124,95,192,.18);
    backdrop-filter: blur(24px) saturate(1.2);
    -webkit-backdrop-filter: blur(24px) saturate(1.2);
    padding: 16px;
  }
  .widget::before {
    content: "";
    position: absolute;
    left: -80px;
    top: -90px;
    width: 230px;
    height: 230px;
    border-radius: 999px;
    background: rgba(255,255,255,.40);
    filter: blur(24px);
  }
  .widget::after {
    content: "";
    position: absolute;
    right: -70px;
    bottom: -80px;
    width: 240px;
    height: 240px;
    border-radius: 999px;
    background: rgba(150,104,244,.30);
    filter: blur(30px);
  }
  .head {
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 10px;
    position: relative;
    z-index: 1;
  }
  .title {
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(120deg, var(--accent), var(--accent-soft));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 0.2px;
  }
  .count {
    font-size: 12px;
    font-weight: 600;
    color: #44395f;
    background: rgba(255,255,255,.44);
    border: 1px solid rgba(255,255,255,.65);
    border-radius: 999px;
    padding: 4px 10px;
  }
  .row {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
    border-radius: 12px;
    background: rgba(255,255,255,.35);
    border: 1px solid rgba(255,255,255,.55);
    padding: 9px 10px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: rgba(255,255,255,.95);
    flex: 0 0 auto;
  }
  .meta { display:flex; flex-direction:column; min-width:0; line-height:1.2; }
  .link { font-size:15px; color:var(--text); font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:500px; }
  .domain { font-size:11px; color:rgba(42,37,59,.65); font-weight:500; }
</style>
</head>
<body>
  <div class="widget">
    <div class="head">
      <div class="title">AddEm</div>
      <div class="count">4 links</div>
    </div>
    <div class="row"><div class="dot"></div><div class="meta"><div class="link">Apple Dev</div><div class="domain">developer.apple.com</div></div></div>
    <div class="row"><div class="dot"></div><div class="meta"><div class="link">HN</div><div class="domain">news.ycombinator.com</div></div></div>
    <div class="row"><div class="dot"></div><div class="meta"><div class="link">Notion Docs</div><div class="domain">notion.so</div></div></div>
    <div class="row"><div class="dot"></div><div class="meta"><div class="link">Design Inspiration</div><div class="domain">dribbble.com</div></div></div>
  </div>
</body>
</html>
